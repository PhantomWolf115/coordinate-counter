<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1b4f72" />
    <meta name="description" content="Count coordinates in CSV files in your browser." />
    <title>Coordinate Counter</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231b4f72'/%3E%3Cpath d='M7 9h18v2H7zm0 6h18v2H7zm0 6h12v2H7z' fill='%23fff'/%3E%3C/svg%3E" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <h1>Coordinate Counter</h1>
        <p class="subtitle">Select CSV files to count coordinates. Works offline in your browser.</p>
      </header>

      <section class="actions">
        <label class="file-button">
          Select CSV Files
          <input id="file-input" type="file" accept=".csv,text/csv" multiple />
        </label>
        <button id="copy-btn" type="button" disabled>Copy to Clipboard</button>
      </section>

      <section class="table-wrap" aria-live="polite">
        <table class="results">
          <thead>
            <tr>
              <th scope="col">Filename</th>
              <th scope="col" class="num">Count</th>
            </tr>
          </thead>
          <tbody id="results-body">
            <tr class="empty">
              <td colspan="2">No files selected yet.</td>
            </tr>
          </tbody>
        </table>
      </section>

      <div id="toast" class="toast" hidden role="status"></div>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
